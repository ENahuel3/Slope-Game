<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#231F20">
    <title>Slope</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23231F20'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2300e676'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="TemplateData/mod.css">
    <script src="TemplateData/mod.js"></script>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/unityloader41.js"></script>
</head>

<!--
Modded fork of https://github.com/cgolden15/Slope-Game
Changes vs upstream: ads, analytics and the promo banner are gone,
the page is a proper HTML5 document, there is a fullscreen button
(or press F), a session timer, a "Courses" selector that stacks 1-5
random courses on top of each other, and outbound calls to the id.net /
y8 ad + leaderboard backend are blocked (see TemplateData/mod.js).
Slope game itself is by Y8 Games / IDnet, not by this fork.
-->

<body>
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>

    <div id="hud" class="hud">
        <span class="hud-title">SLOPE</span>
        <span class="hud-sep"></span>
        <span class="hud-hint">&larr; &rarr; or A / D to steer</span>
        <span class="hud-sep"></span>
        <span class="hud-label" title="How many random courses are overlapped on top of each other">Courses</span>
        <span id="hud-stack" class="hud-stack"></span>
        <span class="hud-spacer"></span>
        <span id="hud-timer" class="hud-timer" title="Time on this page">00:00</span>
        <button id="hud-fs" class="hud-btn" type="button" title="Fullscreen (F)">&#x26F6; Fullscreen</button>
    </div>

    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function () {
                    UnityProgress(gameInstance, "complete");
                    SlopeMod.onGameReady();
                }
            }
        });
        SlopeMod.init(gameInstance);
    </script>
</body>
</html>
